name: Build Windows EXE on every commit

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "spec/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Generate Windows version-info file
        shell: bash
        run: |
          mkdir -p build
          short_sha=${GITHUB_SHA:0:7}
          stamp=$(date -u +%Y.%m.%d)
          ver_str="build-${stamp}-${short_sha}"
          cat > build/version.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, 0, 0, 0),
              prodvers=(0, 0, 0, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)),
            kids=[
              StringFileInfo([
                StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'cbolong'),
                  StringStruct(u'FileDescription', u'SST39 Flash EEPROM Programmer'),
                  StringStruct(u'FileVersion', u'${ver_str}'),
                  StringStruct(u'InternalName', u'SST39FlashProgrammer'),
                  StringStruct(u'OriginalFilename', u'SST39FlashProgrammer.exe'),
                  StringStruct(u'ProductName', u'SST39 Flash Programmer'),
                  StringStruct(u'ProductVersion', u'${ver_str}')])]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])])
          EOF

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --clean \
            --name SST39FlashProgrammer \
            --collect-submodules serial \
            --hidden-import serial.tools.list_ports_windows \
            --noupx \
            --icon assets/icon.ico \
            --version-file build/version.txt \
            binFileTransferGui.py

      - name: Compute build tag
        id: tag
        shell: bash
        run: |
          ts=$(date -u +%Y%m%d-%H%M%S)
          short_sha=${GITHUB_SHA:0:7}
          echo "tag=build-${ts}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Create release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Auto build ${{ steps.tag.outputs.tag }}"
          body: |
            Auto-built EXE for commit ${{ github.sha }}.

            Commit message:
            ${{ github.event.head_commit.message }}
          prerelease: false
          make_latest: "true"
          files: dist/SST39FlashProgrammer.exe

      - name: Prune old auto-build EXE assets, keep latest 4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,publishedAt \
            --jq 'map(select(.tagName | startswith("build-"))) |
                  sort_by(.publishedAt) | reverse | .[4:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "Pruning EXE asset from $tag"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[] | select(.name=="SST39FlashProgrammer.exe") | .name' \
              | xargs -r -I{} gh release delete-asset "$tag" "{}" --repo "$GITHUB_REPOSITORY" --yes
            done
