name: Build Windows EXE on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name SST39FlashProgrammer binFileTransferGui.py

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: SST39FlashProgrammer
          path: dist/SST39FlashProgrammer.exe

      - name: Attach EXE to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SST39FlashProgrammer.exe
