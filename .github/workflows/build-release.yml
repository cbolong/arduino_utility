name: Build Windows EXE on every commit

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "spec/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name SST39FlashProgrammer binFileTransferGui.py

      - name: Compute build tag
        id: tag
        shell: bash
        run: |
          ts=$(date -u +%Y%m%d-%H%M%S)
          short_sha=${GITHUB_SHA:0:7}
          echo "tag=build-${ts}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Create release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Auto build ${{ steps.tag.outputs.tag }}"
          body: |
            Auto-built EXE for commit ${{ github.sha }}.

            Commit message:
            ${{ github.event.head_commit.message }}
          prerelease: false
          make_latest: "true"
          files: dist/SST39FlashProgrammer.exe

      - name: Prune old auto-build EXE assets, keep latest 4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,publishedAt \
            --jq 'map(select(.tagName | startswith("build-"))) |
                  sort_by(.publishedAt) | reverse | .[4:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "Pruning EXE asset from $tag"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[] | select(.name=="SST39FlashProgrammer.exe") | .name' \
              | xargs -r -I{} gh release delete-asset "$tag" "{}" --repo "$GITHUB_REPOSITORY" --yes
            done
